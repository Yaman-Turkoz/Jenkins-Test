env:
  contexts:
    - name: dvwa
      urls:
        - "http://dvwa/"
      includePaths:
        - "http://dvwa/.*"
      excludePaths:
        - "http://dvwa/logout.php"
        - "http://dvwa/setup.php"
        - "http://dvwa/vulnerabilities/csrf/.*"
        - "http://dvwa/vulnerabilities/authbypass/.*"
      sessionManagement:
        method: cookie

  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: scanPolicyDefinition
    parameters:
      name: xss-only
      defaultStrength: medium
      defaultThreshold: "off"    # varsayılan olarak her şeyi kapat
    rules:
      - id: 40012    # Cross Site Scripting (Reflected)
        threshold: medium
      - id: 40014    # Cross Site Scripting (Persistent)
        threshold: medium
      - id: 40016    # Cross Site Scripting (Persistent) - Prime
        threshold: medium
      - id: 40017    # Cross Site Scripting (Persistent) - Spider
        threshold: medium

  - type: spider
    parameters:
      context: dvwa
      url: "http://dvwa/"
      maxDuration: 5
      maxDepth: 5

  - type: activeScan
    parameters:
      context: dvwa
      policy: xss-only           # sadece bu policy'yi kullan
      maxScanDurationInMins: 15

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: dvwa-xss-report
      reportTitle: "DVWA XSS Scan"
