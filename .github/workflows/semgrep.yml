name: Semgrep Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # run semgrep
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan . \
            --config=semgrep-rules/workflow-rules/ \
            --baseline-commit HEAD~1 \
            --json \
            --output=semgrep-report.json || true

      # open issues for semgrep findings
      # writes created-issues.json for the ai
      - name: Create GitHub Issues for findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/create_issues.py

      # posts a comment on each opened issue
      # read created-issues.json, fetches source files via GitHub API and comments: verdict, fix, PoC, and code flow.
      - name: AI Analysis — comment on issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ai_analyze.py

      # artifacts
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            semgrep-report.json
            created-issues.json
