name: Semgrep Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write        # needed to create branches and commit files
      pull-requests: write   # needed to open PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Run semgrep, only on diff vs previous commit
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan . \
            --config=semgrep-rules/workflow-rules/ \
            --baseline-commit HEAD~1 \
            --json \
            --output=semgrep-report.json || true

      # Open one GitHub Issue per rule that has findings.
      # Writes created-issues.json consumed by the next two steps.
      - name: Create GitHub Issues for findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/create_issues.py

      # Post a comment on each issue: verdict, fix advice, PoC, code flow.
      - name: AI Analysis — comment on issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ai_analyze.py

      # For every true-positive finding: create a fix branch, commit the
      # patched file, open a PR, and link it back to the issue.
      # A human must review and merge — nothing is auto-merged.
      - name: AI Fix — open PRs for true positives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ai_fix.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            semgrep-report.json
            created-issues.json
