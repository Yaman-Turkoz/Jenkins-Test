rules:

  - id: xss-and-debug
    mode: taint
    languages: [php]
    severity: WARNING
    message: >
      XSS vulnerability detected: user-controlled data ($SINK) reaches an unsafe sink
      without being sanitized. This can lead to a Cross-Site Scripting (XSS) attack.

    pattern-sources:

      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: $_FILES[...]


    pattern-sanitizers:
    
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: json_encode(...)


    pattern-sinks:

      - pattern: echo $SINK;
      - pattern: echo($SINK);
      - pattern: print $SINK;
      - pattern: print($SINK);

      - pattern: printf($SINK, ...);
      - pattern: printf(..., $SINK);
      - pattern: fprintf(..., $SINK, ...);
      - pattern: vprintf($SINK, ...);

      - pattern: die($SINK);
      - pattern: exit($SINK);

      - pattern: var_dump($SINK);
      - pattern: var_dump($SINK, ...);
      - pattern: print_r($SINK);

      - pattern: fputs(..., $SINK)
      - pattern: fwrite(..., $SINK)



  - id: ssrf-taint
    mode: taint
    languages: [php]
    severity: WARNING
    message: >
      SSRF vulnerability detected: user-controlled data ($SINK) reaches a network
      or file-fetching function without validation. An attacker can force the server
      to make requests to internal services or arbitrary external hosts.
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]


    pattern-sinks:
  
      - pattern: curl_init($SINK)
      - pattern: curl_setopt($CH, CURLOPT_URL, $SINK)
      - pattern: curl_setopt($CH, CURLOPT_PROXY, $SINK)
      - pattern: curl_setopt_array($CH, [..., CURLOPT_URL => $SINK, ...])

      - pattern: file_get_contents($SINK, ...)
      - pattern: fopen($SINK, ...)
      - pattern: file($SINK, ...)
      - pattern: readfile($SINK, ...)

      - pattern: fsockopen($SINK, ...)
      - pattern: pfsockopen($SINK, ...)
      - pattern: stream_socket_client($SINK, ...)

      - pattern: get_headers($SINK, ...)
      - pattern: getimagesize($SINK, ...)


